services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: flashin
      POSTGRES_USER: flashin
      POSTGRES_PASSWORD: flashin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashin -d flashin"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ready || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE: ${API_PUBLIC_URL:-http://localhost:8000}
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
      args:
        VITE_API_BASE: ${API_PUBLIC_URL:-http://localhost:8000}
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5174:5174"

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy

  notification_worker:
    build:
      context: .
      dockerfile: Dockerfile.bot
    command: ["python", "-m", "bot.send_notifications"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - workers

  ops_jobs:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "scripts/run_ops_jobs.py"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - workers

  outbox_jobs:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "scripts/run_outbox_jobs.py"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - workers

  moysklad_sync:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "scripts/run_moysklad_sync.py"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - workers

  campaign_jobs:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "scripts/run_campaign_jobs.py"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - workers

  sla_jobs:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "scripts/run_sla_jobs.py"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - workers

  event_jobs:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "scripts/run_event_jobs.py"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - workers

  media_jobs:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "scripts/run_media_jobs.py"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - workers

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "scripts/run_scheduler.py"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - scheduler

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-change-me}
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    profiles:
      - search

  prometheus:
    image: prom/prometheus
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    profiles:
      - monitoring

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - frontend
      - admin
      - backend
    profiles:
      - production

volumes:
  pgdata:
  media:
  meili_data:
  caddydata:
  caddyconfig:

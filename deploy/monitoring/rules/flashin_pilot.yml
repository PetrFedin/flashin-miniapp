groups:
  - name: flashin-controlled-pilot
    interval: 15s
    rules:
      - alert: FlashinPilotMetricsUnavailable
        expr: absent(flashin_pilot_metrics_collection_success) or flashin_pilot_metrics_collection_success == 0
        for: 1m
        labels:
          severity: critical
          service: flashin-backend
          component: pilot-runtime
        annotations:
          summary: Controlled pilot metrics are unavailable
          description: Prometheus cannot confirm the current pilot runtime and checkout must remain closed.

      - alert: FlashinPilotRuntimeStopped
        expr: (flashin_pilot_runtime_enforced == 1) and on() (flashin_pilot_runtime_status{status="stopped"} == 1)
        for: 0m
        labels:
          severity: critical
          service: flashin-backend
          component: pilot-runtime
        annotations:
          summary: Controlled pilot runtime is stopped
          description: A manual or automatic safety stop is active. Do not admit another checkout.

      - alert: FlashinPilotDatabaseIntegrityFailed
        expr: (flashin_pilot_runtime_enforced == 1) and on() (flashin_pilot_database_integrity_healthy == 0)
        for: 0m
        labels:
          severity: critical
          service: flashin-backend
          component: pilot-runtime
        annotations:
          summary: Pilot database integrity check failed
          description: Runtime state, order counters or slot bindings are inconsistent. Checkout must remain closed.

      - alert: FlashinPilotArtifactIntegrityFailed
        expr: (flashin_pilot_runtime_enforced == 1) and on() (flashin_pilot_artifact_integrity_applicable == 1) and on() (flashin_pilot_artifact_integrity_healthy == 0)
        for: 0m
        labels:
          severity: critical
          service: flashin-backend
          component: pilot-runtime
        annotations:
          summary: Pilot admission or release evidence is invalid
          description: Signed admission, evidence or current/previous capability-v4 release bindings are not confirmed.

      - alert: FlashinPilotMoneyAttentionRequired
        expr: sum(flashin_pilot_money_attention) > 0
        for: 0m
        labels:
          severity: critical
          service: flashin-backend
          component: pilot-money-integrity
        annotations:
          summary: A pilot payment or refund requires review
          description: At least one payment review, refund review/retry or reconciliation mismatch is unresolved.

      - alert: FlashinPilotUnexpectedNoGo
        expr: (flashin_pilot_runtime_enforced == 1) and on() (flashin_pilot_runtime_status{status="active"} == 1) and on() (flashin_pilot_checkout_ready == 0)
        for: 1m
        labels:
          severity: critical
          service: flashin-backend
          component: pilot-runtime
        annotations:
          summary: Active pilot runtime is not ready for checkout
          description: The runtime reports active but one or more fail-closed admission conditions are not satisfied.

      - alert: FlashinPilotCapacityLow
        expr: (flashin_pilot_runtime_status{status="active"} == 1) and on() (flashin_pilot_orders_remaining > 0) and on() (flashin_pilot_orders_remaining <= 3)
        for: 0m
        labels:
          severity: warning
          service: flashin-backend
          component: pilot-runtime
        annotations:
          summary: Controlled pilot is close to the 20-order limit
          description: Three or fewer controlled checkout slots remain. Prepare final reconciliation and closure.

      - alert: FlashinRateLimitBackendUnavailable
        expr: flashin_rate_limit_backend_available == 0
        for: 30s
        labels:
          severity: critical
          service: flashin-backend
          component: rate-limit
        annotations:
          summary: Shared Redis rate-limit authority is unavailable
          description: Sensitive authentication, checkout, payment, return and webhook routes fail closed while the distributed limiter is unavailable.

      - alert: FlashinRateLimitFailClosed
        expr: sum(increase(flashin_rate_limit_decisions_total{outcome="backend_fail_closed"}[5m])) > 0
        for: 0m
        labels:
          severity: critical
          service: flashin-backend
          component: rate-limit
        annotations:
          summary: A sensitive request was blocked because the shared limiter failed
          description: Investigate Redis availability before reopening sensitive request paths.

      - alert: FlashinRateLimitRejectionsHigh
        expr: sum(increase(flashin_rate_limit_decisions_total{outcome="rejected"}[5m])) >= 5
        for: 0m
        labels:
          severity: warning
          service: flashin-backend
          component: rate-limit
        annotations:
          summary: FLASHIN is actively rate limiting repeated requests
          description: At least five requests were rejected in five minutes. Review route category, source traffic and abuse patterns.

      - alert: FlashinWebhookOutboxMetricsUnavailable
        expr: absent(flashin_webhook_outbox_metrics_collection_success) or flashin_webhook_outbox_metrics_collection_success == 0
        for: 1m
        labels:
          severity: critical
          service: flashin-backend
          component: webhook-delivery
        annotations:
          summary: Webhook outbox review metrics are unavailable
          description: FLASHIN cannot confirm whether ambiguous webhook deliveries require operator reconciliation.

      - alert: FlashinWebhookOutboxReviewRequired
        expr: flashin_webhook_outbox_review_required_total > 0
        for: 0m
        labels:
          severity: critical
          service: flashin-backend
          component: webhook-delivery
        annotations:
          summary: Webhook delivery requires operator reconciliation
          description: At least one external webhook has an ambiguous or permanent post-dispatch outcome and automatic replay is quarantined.

      - alert: FlashinProviderCommandMetricsUnavailable
        expr: absent(flashin_provider_command_metrics_collection_success) or flashin_provider_command_metrics_collection_success == 0
        for: 1m
        labels:
          severity: critical
          service: flashin-backend
          component: provider-integration
        annotations:
          summary: Provider command metrics are unavailable
          description: The pilot cannot confirm delivery state for durable MoySklad commands. Stop new pilot checkout until telemetry is restored.

      - alert: FlashinProviderCommandReviewRequired
        expr: flashin_provider_commands{provider="moysklad",status="review_required"} > 0
        for: 0m
        labels:
          severity: critical
          service: flashin-backend
          component: provider-integration
        annotations:
          summary: MoySklad command requires operator review
          description: At least one deterministic MoySklad mapping, money or configuration error requires resolution before the pilot continues.

      - alert: FlashinProviderCommandFailed
        expr: flashin_provider_commands{provider="moysklad",status="failed"} > 0
        for: 0m
        labels:
          severity: critical
          service: flashin-backend
          component: provider-integration
        annotations:
          summary: MoySklad command exhausted retries
          description: At least one durable MoySklad command reached terminal failure. Reconcile the related order before further pilot checkout.

      - alert: FlashinProviderCommandLeaseExpired
        expr: flashin_provider_command_due{provider="moysklad",kind="expired_processing"} > 0
        for: 2m
        labels:
          severity: critical
          service: flashin-backend
          component: provider-integration
        annotations:
          summary: MoySklad command lease remains expired
          description: A provider command processing lease has remained recoverable for two minutes, indicating a stalled or unhealthy worker.

      - alert: FlashinProviderCommandBacklogStale
        expr: (flashin_provider_command_actionable{provider="moysklad"} > 0) and on(provider) (flashin_provider_command_oldest_actionable_age_seconds{provider="moysklad"} > 300)
        for: 5m
        labels:
          severity: warning
          service: flashin-backend
          component: provider-integration
        annotations:
          summary: MoySklad provider backlog is stale
          description: A durable MoySklad command has required delivery or operator action for more than five minutes. Investigate provider availability and retry state.

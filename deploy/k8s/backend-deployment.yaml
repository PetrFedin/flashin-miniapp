apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: flashin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: flashin/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: flashin-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: flashin
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000

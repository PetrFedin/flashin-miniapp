x-app-security: &app-security
  user: "10001:10001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=64m

services:
  db:
    restart: unless-stopped
    ports: !reset []
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    restart: unless-stopped
    ports: !reset []

  backend:
    <<: *app-security
    restart: unless-stopped
    ports: !reset []
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./docs:/app/docs:ro
      - ./deploy/release:/app/deploy/release:ro
      - exports_data:/app/exports

  frontend:
    restart: unless-stopped
    ports: !reset []

  admin:
    restart: unless-stopped
    ports: !reset []

  bot:
    <<: *app-security
    restart: unless-stopped
    stop_grace_period: 30s

  notification_worker:
    <<: *app-security
    restart: unless-stopped
    stop_grace_period: 30s

  ops_jobs:
    <<: *app-security
    restart: unless-stopped
    stop_grace_period: 30s

  outbox_jobs:
    <<: *app-security
    restart: unless-stopped
    stop_grace_period: 30s

  provider_command_jobs:
    <<: *app-security
    restart: unless-stopped
    stop_grace_period: 30s

  moysklad_sync:
    <<: *app-security
    restart: unless-stopped
    stop_grace_period: 30s

  campaign_jobs:
    <<: *app-security
    restart: unless-stopped
    stop_grace_period: 30s

  sla_jobs:
    <<: *app-security
    restart: unless-stopped
    stop_grace_period: 30s

  event_jobs:
    <<: *app-security
    restart: unless-stopped
    stop_grace_period: 30s

  media_jobs:
    <<: *app-security
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - media:/app/media

  scheduler:
    <<: *app-security
    restart: unless-stopped
    stop_grace_period: 30s

  meilisearch:
    restart: unless-stopped
    ports: !reset []

  alertmanager:
    restart: unless-stopped
    ports: !reset []
    stop_grace_period: 30s

  prometheus:
    restart: unless-stopped
    ports: !reset []

  grafana:
    restart: unless-stopped
    ports: !reset []
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"

  caddy:
    restart: unless-stopped

volumes:
  exports_data:

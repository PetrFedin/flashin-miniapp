name: Production Stateful Admission

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact Git SHA to probe
        required: true
        type: string
      connectivity_only:
        description: Check reachability without requiring current Alembic heads
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  stateful-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_sha }}
      CONNECTIVITY_ONLY: ${{ inputs.connectivity_only }}
      DATABASE_URL: ${{ secrets.FLASHIN_PRODUCTION_DATABASE_URL }}
      RATE_LIMIT_REDIS_URL: ${{ secrets.FLASHIN_PRODUCTION_REDIS_URL }}
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # releases/v4
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Prove checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha must be a full 40-character lowercase Git SHA" >&2
            exit 1
          fi
          test "$actual_sha" = "$EXPECTED_SOURCE_SHA"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # releases/v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check --timeout 60 --retries 8 -r backend/requirements.txt

      - name: Probe dedicated PostgreSQL and Redis/Valkey
        id: probe
        shell: bash
        run: |
          set -uo pipefail
          probe_args=()
          if [ "$CONNECTIVITY_ONLY" = "true" ]; then
            probe_args+=(--connectivity-only)
          fi

          set +e
          python -m scripts.stateful_admission_probe "${probe_args[@]}" > /tmp/stateful-probe.json
          probe_status=$?
          set -e

          python3 - "$EXPECTED_SOURCE_SHA" /tmp/stateful-probe.json <<'PY'
          import json
          import subprocess
          import sys

          expected_sha, probe_path = sys.argv[1:3]
          actual_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"],
              text=True,
          ).strip()

          with open(probe_path, encoding="utf-8") as handle:
              probe = json.load(handle)

          report = {
              "schema_version": 1,
              "kind": "flashin_production_stateful_admission",
              "expected_git_sha": expected_sha,
              "git_sha": actual_sha,
              "release_identity_ok": actual_sha == expected_sha,
              "probe": probe,
              "pass": actual_sha == expected_sha and probe.get("status") == "pass",
          }

          with open("production-stateful-admission-proof.json", "w", encoding="utf-8") as handle:
              json.dump(report, handle, sort_keys=True)
              handle.write("\n")

          print(json.dumps(report, sort_keys=True))
          if not report["pass"]:
              raise SystemExit(1)
          PY

          exit "$probe_status"

      - name: Upload sanitized stateful admission proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-stateful-admission-${{ inputs.expected_sha }}
          path: production-stateful-admission-proof.json
          if-no-files-found: warn
          retention-days: 30

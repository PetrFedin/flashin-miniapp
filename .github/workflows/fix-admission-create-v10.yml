name: Fix admission create path v10

on:
  push:
    branches:
      - agent/pilot-admission-bound-control-v10

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pilot-admission-bound-control-v10
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply create-path fix
        run: python3 .github/scripts/fix_admission_create_v10.py
      - name: Validate admission and release contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r backend/requirements.txt
          python3 -m compileall -q scripts backend .github/scripts
          python3 -m pytest -q \
            backend/tests/test_pilot_admission.py \
            backend/tests/test_pilot_control_binding.py \
            backend/tests/test_pilot_runtime.py \
            backend/tests/test_pilot_release_capability.py
      - name: Create clean regression commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-admission-create-v10.yml
          rm .github/scripts/fix_admission_create_v10.py
          git config user.name "FLASHIN Admission Create Guard"
          git config user.email "admission-create-guard@flashin.local"
          git add -A
          git commit -m "Validate signed live gate during admission creation"
      - name: Validate immutable repository archive
        run: python3 -m pytest -q backend/tests/test_pilot_release_capability_repository.py
      - name: Push validated regression fix
        run: git push origin HEAD:agent/pilot-admission-bound-control-v10

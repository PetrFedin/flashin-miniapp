name: Apply signed live gate capability v9

on:
  push:
    branches:
      - agent/pilot-signed-live-gate-v9

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pilot-signed-live-gate-v9
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fail-closed signed live gate
        run: python3 .github/scripts/apply_signed_live_gate_v9.py
      - name: Install and validate targeted contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r backend/requirements.txt
          python3 -m compileall -q scripts backend .github/scripts
          python3 -m pytest -q \
            backend/tests/test_pilot_admission.py \
            backend/tests/test_pilot_release_capability.py \
            backend/tests/test_pilot_runtime.py
      - name: Create clean v9 commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-signed-live-gate-v9.yml
          rm .github/scripts/apply_signed_live_gate_v9.py
          git config user.name "FLASHIN Admission Guard"
          git config user.email "admission-guard@flashin.local"
          git add -A
          git commit -m "Bind live pilot gate to release and configuration"
      - name: Validate immutable repository archive
        run: python3 -m pytest -q backend/tests/test_pilot_release_capability_repository.py
      - name: Push validated signed live gate
        run: git push origin HEAD:agent/pilot-signed-live-gate-v9

name: Apply signed live gate capability v9

on:
  push:
    branches:
      - agent/pilot-signed-live-gate-v9

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pilot-signed-live-gate-v9
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fail-closed signed live gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old[:120]!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Shared immutable release contract.
          replace_once(
              'scripts/pilot_release_contract.py',
              'CAPABILITY_VERSION = 8',
              'CAPABILITY_VERSION = 9',
          )

          # Generate a signed, release-bound live gate report.
          readiness = Path('scripts/readiness_gate.py')
          text = readiness.read_text(encoding='utf-8')
          text = text.replace(
              'import argparse\nimport json\nfrom pathlib import Path\n\nfrom pilot_readiness import (',
              'import argparse\nimport json\nfrom datetime import timedelta\nfrom pathlib import Path\nfrom typing import Any, Mapping\n\nfrom pilot_evidence import (\n'
              '    configuration_fingerprint,\n'
              '    load_json,\n'
              '    release_binding,\n'
              '    require_signing_secret,\n'
              '    sign_payload,\n'
              '    utc_now,\n'
              '    utc_timestamp,\n'
              ')\n'
              'from pilot_readiness import (',
              1,
          )
          text = text.replace(
              '    write_report,\n)\nfrom script_time import utc_timestamp\n\nROOT = Path(__file__).resolve().parents[1]\n',
              '    read_env,\n'
              '    write_report,\n'
              ')\n\nROOT = Path(__file__).resolve().parents[1]\n'
              'CURRENT_RELEASE_PATH = ROOT / "deploy/release/runtime/current_release.json"\n\n\n'
              'def _positive_int(env: Mapping[str, str], key: str, default: int) -> int:\n'
              '    raw = str(env.get(key, default)).strip()\n'
              '    try:\n'
              '        value = int(raw)\n'
              '    except ValueError as exc:\n'
              '        raise ValueError(f"{key} must be an integer") from exc\n'
              '    if value < 5 or value > 120:\n'
              '        raise ValueError(f"{key} must be between 5 and 120")\n'
              '    return value\n\n\n'
              'def build_signed_live_report(\n'
              '    report: Mapping[str, Any],\n'
              '    *,\n'
              '    env: Mapping[str, str],\n'
              '    current_release: Mapping[str, Any],\n'
              '    max_age_minutes: int,\n'
              ') -> dict[str, Any]:\n'
              '    secret = require_signing_secret(env)\n'
              '    created = utc_now()\n'
              '    payload = dict(report)\n'
              '    payload.update(\n'
              '        {\n'
              '            "schema_version": 1,\n'
              '            "kind": "pilot_live_gate",\n'
              '            "generated_at": utc_timestamp(created),\n'
              '            "created_at": utc_timestamp(created),\n'
              '            "expires_at": utc_timestamp(created + timedelta(minutes=max_age_minutes)),\n'
              '            "configuration_fingerprint": configuration_fingerprint(env, secret),\n'
              '            "release": release_binding(current_release),\n'
              '        }\n'
              '    )\n'
              '    return sign_payload(payload, secret)\n',
              1,
          )
          old_main = (
              '    report = build_report(args.phase, checks)\n'
              '    report["generated_at"] = utc_timestamp()\n'
              '    stem = "readiness_gate_report" if args.phase == "predeploy" else "pilot_live_gate_report"\n'
          )
          new_main = (
              '    report = build_report(args.phase, checks)\n'
              '    if args.phase == "live":\n'
              '        env = read_env(ROOT / ".env")\n'
              '        current_release = load_json(CURRENT_RELEASE_PATH)\n'
              '        max_age_minutes = _positive_int(\n'
              '            env, "PILOT_LIVE_GATE_MAX_AGE_MINUTES", 30\n'
              '        )\n'
              '        report = build_signed_live_report(\n'
              '            report,\n'
              '            env=env,\n'
              '            current_release=current_release,\n'
              '            max_age_minutes=max_age_minutes,\n'
              '        )\n'
              '    else:\n'
              '        report["generated_at"] = utc_timestamp()\n'
              '    stem = "readiness_gate_report" if args.phase == "predeploy" else "pilot_live_gate_report"\n'
          )
          if text.count(old_main) != 1:
              raise SystemExit('readiness_gate.py main report block changed unexpectedly')
          readiness.write_text(text.replace(old_main, new_main, 1), encoding='utf-8')

          # Validate signature, config and current release before admission.
          admission = Path('scripts/pilot_admission.py')
          text = admission.read_text(encoding='utf-8')
          start = text.index('def validate_live_gate_report(')
          end = text.index('\n\ndef build_manifest(', start)
          new_validator = '''def validate_live_gate_report(
    report: Mapping[str, Any],
    *,
    env: Mapping[str, str],
    current_release: Mapping[str, Any],
    max_age_minutes: int,
) -> list[str]:
    errors: list[str] = []
    try:
        secret = require_signing_secret(env)
    except ValueError as exc:
        return [str(exc)]
    if report.get("schema_version") != 1:
        errors.append("unsupported live gate evidence schema")
    if report.get("kind") != "pilot_live_gate":
        errors.append("live gate evidence kind is invalid")
    if not verify_payload_signature(report, secret):
        errors.append("live gate evidence signature is invalid")
    if report.get("configuration_fingerprint") != configuration_fingerprint(env, secret):
        errors.append("live gate configuration fingerprint does not match")
    release = report.get("release")
    if not isinstance(release, Mapping):
        errors.append("live gate release binding is missing")
    else:
        errors.extend(f"live gate release: {item}" for item in validate_release_binding(release, current_release))
    if report.get("phase") != "live":
        errors.append("live gate phase is not live")
    if report.get("go") is not True:
        errors.append("live gate decision is not GO")
    summary = report.get("summary")
    if not isinstance(summary, Mapping) or summary.get("critical_failed") != 0:
        errors.append("live gate has critical failures")
    checks = report.get("checks")
    if not isinstance(checks, list):
        errors.append("live gate checks are missing")
    else:
        provider_checks = [
            item
            for item in checks
            if isinstance(item, Mapping) and item.get("name") == "live:provider_integrations"
        ]
        if len(provider_checks) != 1 or provider_checks[0].get("ok") is not True:
            errors.append("live gate did not verify provider evidence")
    errors.extend(
        validate_evidence_window(
            report,
            now=None,
            maximum_age=timedelta(minutes=max_age_minutes),
        )
    )
    return list(dict.fromkeys(errors))
'''
          text = text[:start] + new_validator + text[end:]
          old_call = '''            validate_live_gate_report(
                load_json(live_path),
                max_age_minutes=live_max_age_minutes,
            )'''
          new_call = '''            validate_live_gate_report(
                load_json(live_path),
                env=env,
                current_release=current_release,
                max_age_minutes=live_max_age_minutes,
            )'''
          if text.count(old_call) != 1:
              raise SystemExit('pilot_admission.py live gate call changed unexpectedly')
          admission.write_text(text.replace(old_call, new_call, 1), encoding='utf-8')

          # Update admission tests with signed live evidence and negative binding cases.
          tests = Path('backend/tests/test_pilot_admission.py')
          text = tests.read_text(encoding='utf-8')
          text = text.replace(
              'from pilot_admission import (  # noqa: E402\n',
              'from pilot_admission import (  # noqa: E402\n',
              1,
          )
          text = text.replace(
              'from pilot_evidence import (  # noqa: E402\n',
              'from readiness_gate import build_signed_live_report  # noqa: E402\n'
              'from pilot_evidence import (  # noqa: E402\n',
              1,
          )
          start = text.index('def live_report(')
          end = text.index('\n\ndef write_json(', start)
          helper = '''def live_report(now, values, current):
    unsigned = {
        "phase": "live",
        "go": True,
        "summary": {"total": 10, "passed": 10, "critical_failed": 0, "optional_failed": 0},
        "critical_failed": [],
        "checks": [
            {"name": "live:api_ready", "ok": True, "critical": True, "detail": "ok"},
            {"name": "live:provider_integrations", "ok": True, "critical": True, "detail": "ok"},
        ],
    }
    report = build_signed_live_report(
        unsigned,
        env=values,
        current_release=current,
        max_age_minutes=30,
    )
    report["created_at"] = utc_timestamp(now)
    report["generated_at"] = utc_timestamp(now)
    report["expires_at"] = utc_timestamp(now + timedelta(minutes=30))
    return sign_payload(report, values["PILOT_EVIDENCE_SIGNING_SECRET"])
'''
          text = text[:start] + helper + text[end:]
          text = text.replace('live_report(now))', 'live_report(now, values, current))')
          text = text.replace('report = live_report(now)\n', 'values = env()\n    current = release("current", "a")\n    report = live_report(now, values, current)\n')
          text = text.replace(
              'assert validate_live_gate_report(report, max_age_minutes=30) == []',
              'assert validate_live_gate_report(report, env=values, current_release=current, max_age_minutes=30) == []',
          )
          text = text.replace(
              'errors = validate_live_gate_report(report, max_age_minutes=30)',
              'errors = validate_live_gate_report(report, env=values, current_release=current, max_age_minutes=30)',
          )
          text = text.replace(
              'old = live_report(now - timedelta(minutes=31))\n    errors = validate_live_gate_report(old, max_age_minutes=30)',
              'old = live_report(now - timedelta(minutes=31), values, current)\n    errors = validate_live_gate_report(old, env=values, current_release=current, max_age_minutes=30)',
          )
          text += '''\n\ndef test_live_gate_rejects_tampering_configuration_and_other_release():
    now = datetime.now(UTC)
    values = env()
    current = release("current", "a")
    report = live_report(now, values, current)

    tampered = dict(report)
    tampered["go"] = False
    errors = validate_live_gate_report(
        tampered, env=values, current_release=current, max_age_minutes=30
    )
    assert any("signature" in item for item in errors)

    changed_env = dict(values)
    changed_env["MEILISEARCH_MASTER_KEY"] = "different"
    errors = validate_live_gate_report(
        report, env=changed_env, current_release=current, max_age_minutes=30
    )
    assert any("configuration fingerprint" in item for item in errors)

    other = release("other", "c")
    errors = validate_live_gate_report(
        report, env=values, current_release=other, max_age_minutes=30
    )
    assert any("live gate release" in item for item in errors)
'''
          tests.write_text(text, encoding='utf-8')

          # Capability v9 makes signed live evidence immutable release policy.
          capability = Path('scripts/pilot_release_capability.py')
          text = capability.read_text(encoding='utf-8')
          text = text.replace(
              '    "scripts/pilot_runtime.py",\n',
              '    "scripts/readiness_gate.py",\n'
              '    "scripts/pilot_admission.py",\n'
              '    "backend/tests/test_pilot_admission.py",\n'
              '    "scripts/pilot_runtime.py",\n',
              1,
          )
          text = text.replace('("CAPABILITY_VERSION = 8",)', '("CAPABILITY_VERSION = 9",)', 1)
          anchor = '            _require_markers(bundle, files, "backend/services/pilot_runtime.py", ("from scripts.pilot_release_contract import CAPABILITY_VERSION", \'"version": CAPABILITY_VERSION\'), errors)\n'
          guards = (
              anchor
              + '            _require_markers(bundle, files, "scripts/readiness_gate.py", ("def build_signed_live_report(", \'"kind": "pilot_live_gate"\', "configuration_fingerprint(env, secret)", "release_binding(current_release)", "return sign_payload(payload, secret)"), errors)\n'
              + '            _require_markers(bundle, files, "scripts/pilot_admission.py", ("live gate evidence signature is invalid", "live gate configuration fingerprint does not match", "live gate release binding is missing", "validate_release_binding(release, current_release)"), errors)\n'
              + '            _require_markers(bundle, files, "backend/tests/test_pilot_admission.py", ("test_live_gate_rejects_tampering_configuration_and_other_release", "configuration fingerprint", "live gate release"), errors)\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit('capability runtime guard anchor changed unexpectedly')
          capability.write_text(text.replace(anchor, guards, 1), encoding='utf-8')

          capability_tests = Path('backend/tests/test_pilot_release_capability.py')
          text = capability_tests.read_text(encoding='utf-8')
          text = text.replace('assert CAPABILITY_VERSION == 8', 'assert CAPABILITY_VERSION == 9', 1)
          text = text.replace('"scripts/pilot_release_contract.py": "CAPABILITY_VERSION = 8\\n",', '"scripts/pilot_release_contract.py": "CAPABILITY_VERSION = 9\\n",', 1)
          insertion = '''    "scripts/readiness_gate.py": (
        'def build_signed_live_report():\\n    pass\\n"kind": "pilot_live_gate"\\n'
        'configuration_fingerprint(env, secret)\\nrelease_binding(current_release)\\n'
        'return sign_payload(payload, secret)\\n'
    ),
    "scripts/pilot_admission.py": (
        'live gate evidence signature is invalid\\n'
        'live gate configuration fingerprint does not match\\n'
        'live gate release binding is missing\\n'
        'validate_release_binding(release, current_release)\\n'
    ),
    "backend/tests/test_pilot_admission.py": (
        'test_live_gate_rejects_tampering_configuration_and_other_release\\n'
        'configuration fingerprint\\nlive gate release\\n'
    ),
'''
          marker = '    "backend/services/pilot_runtime.py": (\n'
          if text.count(marker) != 1:
              raise SystemExit('synthetic runtime fixture anchor changed unexpectedly')
          capability_tests.write_text(text.replace(marker, insertion + marker, 1), encoding='utf-8')

          repository_test = Path('backend/tests/test_pilot_release_capability_repository.py')
          text = repository_test.read_text(encoding='utf-8').replace('v8', 'v9').replace('version 8', 'version 9')
          repository_test.write_text(text, encoding='utf-8')

          matrix = Path('docs/pilot/end_to_end_coverage_matrix.md')
          text = matrix.read_text(encoding='utf-8')
          text = text.replace(
              '| Runtime pilot guard | Allowlist -> first 20 orders -> automatic STOP | Pilot runtime and circuit-breaker tests | PASS | Requires signed admission and controlled live run |',
              '| Runtime pilot guard | Allowlist -> signed release/config-bound live gate -> human admission -> first 20 orders -> automatic STOP | Capability v9, admission/runtime tests and circuit-breaker tests | PASS | Requires fresh signed provider/live evidence and controlled live run |',
          )
          text = text.replace(
              'It does **not** replace deployed provider evidence.',
              'The live gate report is HMAC-signed and bound to the exact current release and configuration fingerprint before human admission can be created. Tampering, cross-release reuse and configuration drift are rejected.\n\nIt does **not** replace deployed provider evidence.',
          )
          matrix.write_text(text, encoding='utf-8')
          PY
      - name: Install and validate targeted contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r backend/requirements.txt
          python3 -m compileall -q scripts backend
          python3 -m pytest -q \
            backend/tests/test_pilot_admission.py \
            backend/tests/test_pilot_release_capability.py \
            backend/tests/test_pilot_runtime.py
      - name: Create clean v9 commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-signed-live-gate-v9.yml
          git config user.name "FLASHIN Admission Guard"
          git config user.email "admission-guard@flashin.local"
          git add -A
          git commit -m "Bind live pilot gate to release and configuration"
      - name: Validate immutable repository archive
        run: python3 -m pytest -q backend/tests/test_pilot_release_capability_repository.py
      - name: Push validated signed live gate
        run: git push origin HEAD:agent/pilot-signed-live-gate-v9

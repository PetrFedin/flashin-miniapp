name: Retry pilot capability v8 contract

on:
  push:
    branches:
      - agent/pilot-release-capability-v8

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pilot-release-capability-v8
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic patch from the original workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/patch-capability-v8.yml').read_text(encoding='utf-8')
          match = re.search(r"python3 - <<'PY'\n(?P<body>.*?)\n          PY\n", workflow, re.S)
          if not match:
              raise SystemExit('Unable to extract deterministic capability patch')
          source = textwrap.dedent(match.group('body'))
          namespace = {'__name__': '__capability_patch__'}
          exec(compile(source, '<capability-v8-patch>', 'exec'), namespace, namespace)
          PY
      - name: Install backend test dependencies
        run: python3 -m pip install -r backend/requirements.txt
      - name: Validate targeted capability contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts backend
          python3 -m pytest -q \
            backend/tests/test_pilot_release_capability.py \
            backend/tests/test_pilot_release_capability_repository.py \
            backend/tests/test_pilot_runtime.py \
            backend/tests/test_backup_integrity.py
      - name: Commit final v8 patch and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-capability-v8.yml
          rm .github/workflows/retry-capability-v8.yml
          git config user.name "FLASHIN Release Guard"
          git config user.email "release-guard@flashin.local"
          git add -A
          git commit -m "Require full rollback capability v8"
          git push origin HEAD:agent/pilot-release-capability-v8

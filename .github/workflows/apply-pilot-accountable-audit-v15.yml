name: Apply accountable pilot audit v15

on:
  push:
    branches:
      - agent/pilot-accountable-audit-v15
    paths:
      - .github/workflows/apply-pilot-accountable-audit-v15.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pilot-accountable-audit-v15
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply accountable audit contract
        run: |
          python .github/scripts/apply_pilot_accountable_audit_v15.py
          python .github/scripts/fix_pilot_accountable_audit_v15.py
      - name: Install and validate targeted contract
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python -m compileall \
            scripts/pilot_control_audit.py \
            scripts/pilot_control_chain.py \
            scripts/pilot_control.py \
            scripts/pilot_runtime.py \
            backend/services/pilot_runtime.py
          pytest -q \
            backend/tests/test_pilot_control.py \
            backend/tests/test_pilot_control_binding.py \
            backend/tests/test_pilot_control_audit.py \
            backend/tests/test_pilot_control_signature.py \
            backend/tests/test_pilot_control_durability.py \
            backend/tests/test_pilot_runtime.py \
            backend/tests/test_pilot_runtime_cli.py \
            backend/tests/test_pilot_runtime_wiring.py \
            backend/tests/test_pilot_release_capability.py
      - name: Create clean v15 commit
        run: |
          rm .github/workflows/apply-pilot-accountable-audit-v15.yml
          rm .github/scripts/apply_pilot_accountable_audit_v15.py
          rm .github/scripts/fix_pilot_accountable_audit_v15.py
          git config user.name "FLASHIN Pilot Audit Guard"
          git config user.email "pilot-audit-guard@flashin.local"
          git add -A
          git commit -m "Bind pilot mutations to admission owners"
      - name: Validate immutable repository archive
        run: pytest -q backend/tests/test_pilot_release_capability_repository.py
      - name: Push validated capability v15
        run: git push origin HEAD:agent/pilot-accountable-audit-v15

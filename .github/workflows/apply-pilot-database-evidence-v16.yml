          helper = '''def _database_evidence_errors(state: Mapping[str, Any], *, final: bool) -> list[str]:
    if str(ROOT) not in sys.path:
        sys.path.insert(0, str(ROOT))
    try:
        from backend.database import SessionLocal
        from backend.pilot_models import PilotRuntimeState
        from backend.services.pilot_database_evidence import validate_pilot_database_evidence

        db = SessionLocal()
        try:

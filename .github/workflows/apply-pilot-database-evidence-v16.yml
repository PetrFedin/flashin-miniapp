          replace_once(
              "backend/services/pilot_runtime.py",
              '    if not unique_errors and validated_anchor is not None:\n        validated_anchor.update(state_anchor(pilot_state))\n    return unique_errors',
              '    if not unique_errors and validated_anchor is not None:\n        validated_anchor.update(state_anchor(pilot_state))\n    if not unique_errors and validated_pilot_state is not None:\n        validated_pilot_state.clear()\n        validated_pilot_state.update(json.loads(json.dumps(pilot_state)))\n    return unique_errors',
          )
          replace_once(
              "backend/services/pilot_runtime.py",
              '''    current_anchor: dict[str, Any] = {}
    file_errors = validate_runtime_files(
        state, settings, env=env, validated_anchor=current_anchor
    )
    if file_errors:
''',
              '''    current_anchor: dict[str, Any] = {}
    current_pilot_state: dict[str, Any] = {}
    file_errors = validate_runtime_files(
        state,
        settings,
        env=env,
        validated_anchor=current_anchor,
        validated_pilot_state=current_pilot_state,
    )
    if file_errors:
''',
          )
          replace_once(
              "backend/services/pilot_runtime.py",
              '''        raise _integrity_failure()

    state.pilot_state_revision = int(current_anchor["revision"])
''',
              '''        raise _integrity_failure()
    database_errors = validate_pilot_database_evidence(
        db, current_pilot_state, state, final=False
    )
    if database_errors:
        raise _integrity_failure()

    state.pilot_state_revision = int(current_anchor["revision"])
''',
          )

          replace_once("scripts/pilot_runtime.py", '        if pilot_state.get("schema_version") != 5:', '        if pilot_state.get("schema_version") != 6:')
          replace_once(
              "scripts/pilot_runtime.py",
              '        if not verify_payload_signature(pilot_state, secret):',
              '        if pilot_state.get("database_evidence_contract") != 1:\n            raise ValueError("Pilot database evidence contract is missing or unsupported")\n        if not verify_payload_signature(pilot_state, secret):',
          )
          replace_once(
              "scripts/pilot_runtime.py",
              '    settings = get_settings()\n',
              '    from backend.services.pilot_database_evidence import validate_pilot_database_evidence\n\n    settings = get_settings()\n',
          )
          old_active = '''            verified_anchor: dict[str, Any] = {}
            errors = validate_runtime_files(
                state, settings, validated_anchor=verified_anchor
            )
            if errors:
                raise ValueError("Active pilot runtime evidence is invalid: " + "; ".join(errors))
'''
          new_active = '''            verified_anchor: dict[str, Any] = {}
            verified_pilot_state: dict[str, Any] = {}
            errors = validate_runtime_files(
                state,
                settings,
                validated_anchor=verified_anchor,
                validated_pilot_state=verified_pilot_state,
            )
            if errors:
                raise ValueError("Active pilot runtime evidence is invalid: " + "; ".join(errors))
            database_errors = validate_pilot_database_evidence(
                db, verified_pilot_state, state, final=False
            )
            if database_errors:
                raise ValueError("Active pilot database evidence is invalid: " + "; ".join(database_errors))
'''
          replace_once("scripts/pilot_runtime.py", old_active, new_active)
          old_arm = '''        verified_anchor: dict[str, Any] = {}
        errors = validate_runtime_files(
            state, settings, validated_anchor=verified_anchor
        )
        if errors:
            raise ValueError("Pilot runtime evidence is invalid: " + "; ".join(errors))
'''
          new_arm = '''        verified_anchor: dict[str, Any] = {}
        verified_pilot_state: dict[str, Any] = {}
        errors = validate_runtime_files(
            state,
            settings,
            validated_anchor=verified_anchor,
            validated_pilot_state=verified_pilot_state,
        )
        if errors:
            raise ValueError("Pilot runtime evidence is invalid: " + "; ".join(errors))
        database_errors = validate_pilot_database_evidence(
            db, verified_pilot_state, state, final=False
        )
        if database_errors:
            raise ValueError("Pilot database evidence is invalid: " + "; ".join(database_errors))
'''
          replace_once("scripts/pilot_runtime.py", old_arm, new_arm)

          capability = read("scripts/pilot_release_capability.py")
          capability = capability.replace('    "backend/services/pilot_runtime.py",\n', '    "backend/services/pilot_runtime.py",\n    "backend/services/pilot_database_evidence.py",\n')
          capability = capability.replace('    "backend/tests/test_pilot_runtime.py",\n', '    "backend/tests/test_pilot_runtime.py",\n    "backend/tests/test_pilot_database_evidence.py",\n')
          capability = capability.replace('("CAPABILITY_VERSION = 15",)', '("CAPABILITY_VERSION = 16",)')
          capability = capability.replace('("SCHEMA_VERSION = 5",', '("SCHEMA_VERSION = 6", "database_evidence_contract",')
          marker_anchor = '            _require_markers(bundle, files, "backend/services/pilot_runtime.py", ("build_admission_binding(manifest_path, manifest)", "validate_state_descendant(", "validate_audit_log(", "approved_operators(manifest)", "state.pilot_state_revision", "armed runtime pilot state replay anchor is missing"), errors)\n'
          if marker_anchor not in capability:
              raise SystemExit("runtime capability marker anchor missing")
          capability = capability.replace(
              marker_anchor,
              marker_anchor
              + '            _require_markers(bundle, files, "backend/services/pilot_database_evidence.py", ("def validate_pilot_database_evidence(", "pilot slot order_id", "PostgreSQL payment", "PostgreSQL refund", "final GO scenario order IDs"), errors)\n'
              + '            _require_markers(bundle, files, "backend/tests/test_pilot_database_evidence.py", ("test_exact_completed_twenty_order_database_evidence_is_accepted", "test_missing_or_wrong_slot_order_fails_closed", "test_payment_refund_status_and_amount_are_read_from_postgresql", "test_final_go_rejects_active_or_incomplete_runtime"), errors)\n'
          )
          capability = capability.replace('"approved_operators(manifest)", "state.pilot_state_revision"', '"approved_operators(manifest)", "validate_pilot_database_evidence(", "state.pilot_state_revision"')
          capability = capability.replace('"approved_operators(manifest)", "pilot_state_revision"', '"approved_operators(manifest)", "validate_pilot_database_evidence(", "pilot_state_revision"')
          write("scripts/pilot_release_capability.py", capability)

          # Synchronize pilot fixtures and capability expectations to schema/capability v16.
          for path in Path("backend/tests").glob("test_pilot*.py"):
              text = path.read_text(encoding="utf-8")
              text = text.replace('"schema_version": 5', '"schema_version": 6')
              text = text.replace("schema_version = 5", "schema_version = 6")
              text = text.replace("capability_v15", "capability_v16")
              text = text.replace("capability-v15", "capability-v16")
              text = text.replace("capability v15", "capability v16")
              text = text.replace('"version": 15', '"version": 16')
              text = text.replace("CAPABILITY_VERSION = 15", "CAPABILITY_VERSION = 16")
              path.write_text(text, encoding="utf-8")

          # Restore the explicit negative schema-five case created above.
          db_test = read("backend/tests/test_pilot_database_evidence.py")
          db_test = db_test.replace('state["schema_version"] = 6\n    try:\n        assert validate_pilot_database_evidence', 'state["schema_version"] = 5\n    try:\n        assert validate_pilot_database_evidence')
          write("backend/tests/test_pilot_database_evidence.py", db_test)

          runbook_path = "docs/pilot/admission_bound_state_migration.md"
          runbook = read(runbook_path)
          runbook = runbook.replace("state schema v5", "state schema v6")
          runbook = runbook.replace("accountable schema v5 state", "database-bound schema v6 state")
          runbook = runbook.replace("same signed pilot capability v15", "same signed pilot capability v16")
          runbook = runbook.replace("Schema v4 has replay protection but no admission-owner audit. All four", "Schema v4 has replay protection but no admission-owner audit. Schema v5 has accountable signed mutations but does not prove the recorded IDs against PostgreSQL. All five")
          runbook = runbook.replace("Existing schema v1, v2, v3 or v4 state", "Existing schema v1, v2, v3, v4 or v5 state")
          runbook = runbook.replace("unattributed schema v4 state", "unattributed schema v4 or database-unverified schema v5 state")
          runbook = runbook.replace("signed audit log records", "signed audit log records")
          runbook += "\n## Database-bound scenario evidence\n\nA scenario may be recorded as `pass` only after its exact sequence has a PostgreSQL `pilot_order_slots` row. The signed `order_id` must equal that slot's order, provider payment/refund identifiers must resolve to exactly one row owned by the same order, and recorded statuses, amounts and currencies must match PostgreSQL. Final GO additionally requires runtime status `completed`, exactly 20 accepted orders and an exact sequence-by-sequence match between all 20 scenarios and slots. Database unavailability or any mismatch fails closed.\n"
          write(runbook_path, runbook)

          matrix_path = "docs/pilot/end_to_end_coverage_matrix.md"
          matrix = read(matrix_path)
          row = "| Database-bound first-20 evidence | Signed scenario claims → exact PostgreSQL pilot slot/order/payment/refund/status/amount/currency → final completed 20-slot equality | PASS | Capability v16 fails closed on fabricated, unrelated, missing or drifted database evidence. |\n"
          if row not in matrix:
              matrix += "\n" + row
          write(matrix_path, matrix)

          # Ensure the pure pilot test now uses canonical integer-looking order IDs.
          test_control = read("backend/tests/test_pilot_control.py")
          test_control = test_control.replace('order_id=f"order-{number}"', 'order_id=str(number)')
          write("backend/tests/test_pilot_control.py", test_control)
          PY
      - name: Install and validate database evidence capability
        shell: bash
        run: |
          pip install -r backend/requirements.txt
          python -m compileall -q backend bot scripts
          python -m pytest -q \
            backend/tests/test_pilot_database_evidence.py \
            backend/tests/test_pilot_control.py \
            backend/tests/test_pilot_control_audit.py \
            backend/tests/test_pilot_control_binding.py \
            backend/tests/test_pilot_control_signature.py \
            backend/tests/test_pilot_control_durability.py \
            backend/tests/test_pilot_runtime.py \
            backend/tests/test_pilot_runtime_cli.py \
            backend/tests/test_pilot_release_capability.py
      - name: Create clean capability v16 commit
        shell: bash
        run: |
          rm -f .github/workflows/apply-pilot-database-evidence-v16.yml
          git config user.name "FLASHIN Database Evidence Guard"
          git config user.email "pilot-db-evidence@flashin.local"
          git add -A
          git diff --cached --check
          git commit -m "Bind pilot evidence to PostgreSQL records"
      - name: Validate immutable repository archive
        shell: bash
        run: |
          python -m pytest -q backend/tests/test_pilot_release_capability_repository.py
      - name: Push validated capability v16
        shell: bash
        run: git push origin HEAD:agent/pilot-database-bound-evidence-v16

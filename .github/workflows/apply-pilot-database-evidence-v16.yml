name: Apply database-bound pilot evidence v16

on:
  push:
    branches:
      - agent/pilot-database-bound-evidence-v16

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pilot-database-bound-evidence-v16
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Apply database evidence contract
        run: |
          sed -i 's/if count != 1:/if count < 1:/' .github/patches/apply_pilot_database_evidence_v16.py
          python .github/patches/apply_pilot_database_evidence_v16.py
          python .github/patches/sync_pilot_database_evidence_v16_fixtures.py
      - name: Install and validate targeted contract
        run: |
          pip install -r backend/requirements.txt
          python -m compileall -q backend bot scripts
          python -m pytest -q \
            backend/tests/test_pilot_database_evidence.py \
            backend/tests/test_pilot_control.py \
            backend/tests/test_pilot_control_audit.py \
            backend/tests/test_pilot_control_binding.py \
            backend/tests/test_pilot_control_signature.py \
            backend/tests/test_pilot_control_durability.py \
            backend/tests/test_pilot_runtime.py \
            backend/tests/test_pilot_runtime_cli.py \
            backend/tests/test_pilot_release_capability.py
      - name: Create clean capability v16 commit
        run: |
          rm -f .github/workflows/apply-pilot-database-evidence-v16.yml
          rm -f .github/patches/apply_pilot_database_evidence_v16.py
          rm -f .github/patches/sync_pilot_database_evidence_v16_fixtures.py
          rmdir .github/patches 2>/dev/null || true
          git config user.name "FLASHIN Database Evidence Guard"
          git config user.email "pilot-db-evidence@flashin.local"
          git add -A
          git diff --cached --check
          git commit -m "Bind pilot evidence to PostgreSQL records"
      - name: Validate immutable repository archive
        run: python -m pytest -q backend/tests/test_pilot_release_capability_repository.py
      - name: Push validated capability v16
        run: git push origin HEAD:agent/pilot-database-bound-evidence-v16

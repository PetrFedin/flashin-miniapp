name: Fix runtime capability v13 fixture

on:
  push:
    branches:
      - agent/pilot-cross-process-lock-v13
    paths:
      - .github/workflows/fix-runtime-capability-v13.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pilot-cross-process-lock-v13
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply fixture fix
        run: python .github/scripts/fix_runtime_capability_v13.py
      - name: Validate runtime and capability contracts
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pytest -q \
            backend/tests/test_pilot_runtime.py \
            backend/tests/test_pilot_runtime_cli.py \
            backend/tests/test_pilot_release_capability.py
      - name: Create clean fixture commit
        run: |
          rm .github/workflows/fix-runtime-capability-v13.yml
          rm .github/scripts/fix_runtime_capability_v13.py
          git config user.name "FLASHIN Runtime Capability Guard"
          git config user.email "runtime-capability-guard@flashin.local"
          git add -A
          git commit -m "Align runtime tests with capability v13"
      - name: Validate immutable repository archive
        run: pytest -q backend/tests/test_pilot_release_capability_repository.py
      - name: Push validated fixture fix
        run: git push origin HEAD:agent/pilot-cross-process-lock-v13

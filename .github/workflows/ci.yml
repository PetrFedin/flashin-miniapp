name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flashin
          POSTGRES_PASSWORD: flashin
          POSTGRES_DB: flashin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flashin -d flashin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://flashin:flashin@127.0.0.1:5432/flashin
      TELEGRAM_BOT_TOKEN: test-token
      BOT_TOKEN: test-token
      JWT_SECRET: test-secret
      ADMIN_EMAIL: admin@test.local
      ADMIN_PASSWORD: test-password
      MINI_APP_URL: http://localhost:5173
      API_PUBLIC_URL: http://localhost:8000
      ADMIN_URL: http://localhost:5174
      USE_CREATE_ALL: "false"
      ENABLE_SEED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q backend bot scripts
      - name: Audit critical integration links
        run: |
          python scripts/integration_integrity.py
          python scripts/runtime_entrypoint_integrity.py
      - name: Validate shell scripts
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Run pilot checkout runtime tests
        run: python -m pytest -q backend/tests/test_pilot_runtime.py backend/tests/test_pilot_runtime_cli.py
      - name: Run pilot release and database guard tests
        run: python -m pytest -q backend/tests/test_pilot_release_capability.py backend/tests/test_pilot_runtime_integrity.py backend/tests/test_pilot_runtime_wiring.py
      - name: Run pilot money circuit-breaker tests
        run: >-
          python -m pytest -q
          backend/tests/test_payment_idempotency.py
          backend/tests/test_payment_reconciliation_runtime.py
          backend/tests/test_pilot_payment_circuit_breaker.py
          backend/tests/test_pilot_circuit_breaker_wiring.py
          backend/tests/test_pilot_money_safety_fail_closed.py
      - name: Run protected pilot operations observability tests
        run: python -m pytest -q backend/tests/test_pilot_operations_observability.py
      - name: Run production pilot environment tests
        run: python -m pytest -q backend/tests/test_validate_env.py backend/tests/test_production_config.py backend/tests/test_production_ingress.py backend/tests/test_readiness.py
      - name: Require one Alembic head
        run: |
          set -euo pipefail
          alembic -c backend/alembic.ini heads | tee /tmp/alembic-heads.txt
          test "$(grep -c '(head)' /tmp/alembic-heads.txt)" -eq 1
      - name: Apply database migrations
        run: alembic -c backend/alembic.ini upgrade head
      - name: Verify migration state
        run: alembic -c backend/alembic.ini current
      - name: Run transactional customer journey smoke
        run: python scripts/customer_journey_smoke.py
      - name: Run transactional referral attribution smoke
        run: python scripts/referral_attribution_smoke.py
      - name: Run transactional order cancellation smoke
        run: python scripts/order_cancellation_smoke.py
      - name: Run transactional full fulfillment smoke
        run: python scripts/full_fulfillment_smoke.py
      - name: Run transactional payment review smoke
        run: python scripts/payment_review_smoke.py
      - name: Run transactional cumulative refund smoke
        run: python scripts/cumulative_refund_smoke.py
      - name: Run atomic business event worker smoke
        run: python scripts/business_event_worker_smoke.py
      - name: Run business event recovery smoke
        run: python scripts/business_event_recovery_smoke.py
      - name: Run owned webhook outbox lease smoke
        run: python scripts/webhook_outbox_lease_smoke.py
      - name: Run owned notification delivery lease smoke
        run: python scripts/notification_delivery_lease_smoke.py
      - name: Run distributed scheduler lock smoke
        run: python scripts/scheduler_lock_smoke.py
      - name: Run durable refund reconciliation review smoke
        run: python scripts/refund_reconciliation_review_smoke.py
      - name: Run backend tests
        run: python -m pytest -q backend/tests --maxfail=1 --tb=short

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package.json
      - name: Install admin dependencies
        working-directory: admin
        run: npm install --no-audit --no-fund
      - name: Run admin tests
        working-directory: admin
        run: npm test
      - name: Build admin
        working-directory: admin
        run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package.json
      - name: Install browser E2E dependencies
        working-directory: e2e
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run Mini App and Admin browser journeys
        working-directory: e2e
        run: npm test
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-evidence
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    needs: [backend, frontend, admin, browser-e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local Compose environment
        run: cp .env.local.example .env
      - name: Validate base Compose configuration
        run: docker compose config --quiet
      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Docker build
        run: docker compose build
      - name: Run signed backup and restore drill
        run: |
          set -euo pipefail
          printf '\nPILOT_EVIDENCE_SIGNING_SECRET=ci-backup-integrity-signing-secret-0123456789abcdef\n' >> .env
          docker compose up -d db
          for _ in $(seq 1 60); do
            if docker compose exec -T db pg_isready -U flashin -d flashin >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker compose exec -T db pg_isready -U flashin -d flashin
          docker compose run --rm backend alembic -c backend/alembic.ini upgrade head
          bash scripts/backup_restore_smoke.sh
          docker compose down -v
      - name: Run signed full release rollback drill
        run: |
          set -euo pipefail
          cp .env.local.example .env
          printf '\nPILOT_EVIDENCE_SIGNING_SECRET=ci-release-rollback-signing-secret-0123456789abcdef\n' >> .env
          bash scripts/release_rollback_smoke.sh
      - name: Validate production Compose isolation
        run: |
          cp .env.production.example .env
          export COMPOSE_FILE="docker-compose.yml:docker-compose.production.yml"
          export COMPOSE_PROFILES="production,workers,scheduler,search"
          docker compose config --quiet
          python3 scripts/check_production_compose.py

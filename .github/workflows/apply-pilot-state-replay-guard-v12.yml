name: Apply pilot state replay guard v12

on:
  push:
    branches:
      - agent/pilot-state-replay-guard-v12
    paths:
      - .github/workflows/apply-pilot-state-replay-guard-v12.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pilot-state-replay-guard-v12
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply replay-resistant state contract
        run: |
          python .github/scripts/apply_pilot_state_replay_guard_v12.py
          python .github/scripts/fix_pilot_state_parent_validation_v12.py
      - name: Install and validate targeted contract
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python -m compileall \
            scripts/pilot_control_chain.py \
            scripts/pilot_control.py \
            scripts/pilot_runtime.py \
            backend/services/pilot_runtime.py \
            backend/pilot_models.py \
            backend/alembic/versions/0023_pilot_state_replay_anchor.py
          pytest -q \
            backend/tests/test_pilot_control.py \
            backend/tests/test_pilot_control_binding.py \
            backend/tests/test_pilot_control_signature.py \
            backend/tests/test_pilot_runtime.py \
            backend/tests/test_pilot_runtime_cli.py \
            backend/tests/test_pilot_runtime_wiring.py \
            backend/tests/test_pilot_runtime_integrity.py \
            backend/tests/test_pilot_state_replay_migration.py \
            backend/tests/test_pilot_release_capability.py
      - name: Create clean v12 commit
        run: |
          rm .github/workflows/apply-pilot-state-replay-guard-v12.yml
          rm .github/scripts/apply_pilot_state_replay_guard_v12.py
          rm .github/scripts/fix_pilot_state_parent_validation_v12.py
          git config user.name "FLASHIN Pilot Replay Guard"
          git config user.email "pilot-replay-guard@flashin.local"
          git add -A
          git commit -m "Anchor pilot state lineage against replay"
      - name: Validate immutable repository archive
        run: pytest -q backend/tests/test_pilot_release_capability_repository.py
      - name: Push validated capability v12
        run: git push origin HEAD:agent/pilot-state-replay-guard-v12

name: Apply pilot capability v8 contract

on:
  push:
    branches:
      - agent/pilot-release-capability-v8

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pilot-release-capability-v8
          fetch-depth: 0
      - name: Patch capability and runtime contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          capability = "scripts/pilot_release_capability.py"
          replace_once(capability, "CAPABILITY_VERSION = 7", "CAPABILITY_VERSION = 8")
          replace_once(
              capability,
              '    "scripts/backup_restore_smoke.sh",\n',
              '    "scripts/backup_restore_smoke.sh",\n    "scripts/release_rollback_smoke.sh",\n',
          )
          replace_once(
              capability,
              '"Run signed backup and restore drill", "bash scripts/backup_restore_smoke.sh", "needs: [backend, frontend, admin, browser-e2e]"',
              '"Run signed backup and restore drill", "bash scripts/backup_restore_smoke.sh", "Run signed full release rollback drill", "bash scripts/release_rollback_smoke.sh", "needs: [backend, frontend, admin, browser-e2e]"',
          )
          replace_once(
              capability,
              '            _require_markers(bundle, files, "scripts/backup_restore_smoke.sh", ("tampered_archive_rejected", "mutated_database_rejected", "restored_value_verified", "verify-live", "restore_postgres.sh --yes"), errors)\n',
              '            _require_markers(bundle, files, "scripts/backup_restore_smoke.sh", ("tampered_archive_rejected", "mutated_database_rejected", "restored_value_verified", "verify-live", "restore_postgres.sh --yes"), errors)\n'
              '            _require_markers(bundle, files, "scripts/release_rollback_smoke.sh", ("ROLLBACK_DRILL=1", "PREVIOUS_MARKER=", "CURRENT_MARKER=", "container_marker=", "restored_name=", "verify-live", "verify --slot both", "verify-rollback", "runtime_image_rebuilt", "release_pointer_promoted", "signed_evidence_verified"), errors)\n',
          )
          replace_once(
              capability,
              '                    "restore_postgres.sh",\n',
              '                    "restore_postgres.sh",\n'
              '                    "docker compose build backend frontend admin bot notification_worker scheduler",\n'
              '                    "RELEASE_STATE_DIR=",\n'
              '                    \'--state-dir "$RELEASE_STATE_DIR"\',\n'
              '                    "PROMOTED_RELEASE=",\n'
              '                    "Rollback release pointer promotion mismatch",\n'
              '                    "verify --slot both",\n'
              '                    "record-rollback",\n',
          )
          replace_once(
              capability,
              '            _require_markers(bundle, files, "backend/services/pilot_circuit_breaker.py",',
              '            _require_markers(bundle, files, "backend/services/pilot_runtime.py", ("from scripts.pilot_release_capability import CAPABILITY_VERSION as PILOT_RUNTIME_CAPABILITY_VERSION", \'"version": PILOT_RUNTIME_CAPABILITY_VERSION\'), errors)\n'
              '            _require_markers(bundle, files, "backend/services/pilot_circuit_breaker.py",',
          )

          runtime = "backend/services/pilot_runtime.py"
          replace_once(
              runtime,
              'from scripts.pilot_evidence import (\n',
              'from scripts.pilot_release_capability import (\n'
              '    CAPABILITY_VERSION as PILOT_RUNTIME_CAPABILITY_VERSION,\n'
              ')\n'
              'from scripts.pilot_evidence import (\n',
          )
          replace_once(runtime, '        "version": 2,', '        "version": PILOT_RUNTIME_CAPABILITY_VERSION,')

          tests = "backend/tests/test_pilot_release_capability.py"
          replace_once(tests, "assert CAPABILITY_VERSION == 7", "assert CAPABILITY_VERSION == 8")
          replace_once(
              tests,
              '        "Run signed backup and restore drill\\n"\n        "bash scripts/backup_restore_smoke.sh\\n"\n',
              '        "Run signed backup and restore drill\\n"\n'
              '        "bash scripts/backup_restore_smoke.sh\\n"\n'
              '        "Run signed full release rollback drill\\n"\n'
              '        "bash scripts/release_rollback_smoke.sh\\n"\n',
          )
          replace_once(
              tests,
              '    "scripts/backup_restore_smoke.sh": (\n        "tampered_archive_rejected\\nmutated_database_rejected\\n"\n        "restored_value_verified\\nverify-live\\nrestore_postgres.sh --yes\\n"\n    ),\n',
              '    "scripts/backup_restore_smoke.sh": (\n'
              '        "tampered_archive_rejected\\nmutated_database_rejected\\n"\n'
              '        "restored_value_verified\\nverify-live\\nrestore_postgres.sh --yes\\n"\n'
              '    ),\n'
              '    "scripts/release_rollback_smoke.sh": (\n'
              '        "ROLLBACK_DRILL=1\\nPREVIOUS_MARKER=previous\\nCURRENT_MARKER=current\\n"\n'
              '        "container_marker=previous\\nrestored_name=sentinel\\nverify-live\\n"\n'
              '        "verify --slot both\\nverify-rollback\\nruntime_image_rebuilt\\n"\n'
              '        "release_pointer_promoted\\nsigned_evidence_verified\\n"\n'
              '    ),\n',
          )
          replace_once(
              tests,
              '    "backend/services/pilot_circuit_breaker.py": (\n',
              '    "backend/services/pilot_runtime.py": (\n'
              '        "from scripts.pilot_release_capability import CAPABILITY_VERSION as PILOT_RUNTIME_CAPABILITY_VERSION\\n"\n'
              '        \'"version": PILOT_RUNTIME_CAPABILITY_VERSION\\n\'\n'
              '    ),\n'
              '    "backend/services/pilot_circuit_breaker.py": (\n',
          )
          replace_once(
              tests,
              '        "scripts/verify_backup.sh\\nrestore_postgres.sh\\n"\n        "pilot_runtime.py _stop\\ncheck_pilot_runtime_integrity.py\\n"\n',
              '        "scripts/verify_backup.sh\\nrestore_postgres.sh\\n"\n'
              '        "docker compose build backend frontend admin bot notification_worker scheduler\\n"\n'
              '        "RELEASE_STATE_DIR=\\n--state-dir \\"$RELEASE_STATE_DIR\\"\\n"\n'
              '        "PROMOTED_RELEASE=\\nRollback release pointer promotion mismatch\\n"\n'
              '        "verify --slot both\\nrecord-rollback\\n"\n'
              '        "pilot_runtime.py _stop\\ncheck_pilot_runtime_integrity.py\\n"\n',
          )
          with Path(tests).open("a", encoding="utf-8") as handle:
              handle.write('''\n\ndef test_immutable_archive_rejects_missing_full_release_rollback_proof(tmp_path):\n    repo = _guarded_repo(tmp_path)\n    smoke = repo / "scripts/release_rollback_smoke.sh"\n    smoke.write_text("ROLLBACK_DRILL=1\\n", encoding="utf-8")\n    _git(repo, "add", str(smoke.relative_to(repo)))\n    _git(repo, "commit", "-qm", "remove full rollback proof")\n    archive = _release(repo, tmp_path, "missing-full-rollback", "2026-08-05T00:00:00Z")\n\n    errors = inspect_runtime_guard(archive)\n\n    assert any("runtime_image_rebuilt" in error for error in errors)\n''')

          repository_test = Path("backend/tests/test_pilot_release_capability_repository.py")
          repository_text = repository_test.read_text(encoding="utf-8")
          repository_text = repository_text.replace("v7", "v8").replace("version 7", "version 8")
          repository_test.write_text(repository_text, encoding="utf-8")

          for path in Path("backend/tests").glob("test_pilot_runtime*.py"):
              text = path.read_text(encoding="utf-8")
              if '"version": 2' in text and "pilot_runtime_guard" in text:
                  path.write_text(text.replace('"version": 2', '"version": 8'), encoding="utf-8")
          PY
      - name: Validate targeted capability contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts backend
          python3 -m pytest -q \
            backend/tests/test_pilot_release_capability.py \
            backend/tests/test_pilot_release_capability_repository.py \
            backend/tests/test_pilot_runtime.py \
            backend/tests/test_backup_integrity.py
      - name: Commit final v8 patch and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-capability-v8.yml
          git config user.name "FLASHIN Release Guard"
          git config user.email "release-guard@flashin.local"
          git add -A
          git commit -m "Require full rollback capability v8"
          git push origin HEAD:agent/pilot-release-capability-v8

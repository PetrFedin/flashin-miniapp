name: Finalize pilot capability v8 import guard

on:
  push:
    branches:
      - agent/pilot-release-capability-v8

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pilot-release-capability-v8
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic v8 patch and multiline import guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/patch-capability-v8.yml').read_text(encoding='utf-8')
          match = re.search(r"python3 - <<'PY'\n(?P<body>.*?)\n          PY\n", workflow, re.S)
          if not match:
              raise SystemExit('Unable to extract deterministic capability patch')
          source = textwrap.dedent(match.group('body'))
          namespace = {'__name__': '__capability_patch__'}
          exec(compile(source, '<capability-v8-patch>', 'exec'), namespace, namespace)

          capability = Path('scripts/pilot_release_capability.py')
          capability_text = capability.read_text(encoding='utf-8')
          old_guard = '("from scripts.pilot_release_capability import CAPABILITY_VERSION as PILOT_RUNTIME_CAPABILITY_VERSION", \'"version": PILOT_RUNTIME_CAPABILITY_VERSION\')'
          new_guard = '("from scripts.pilot_release_capability import (", "CAPABILITY_VERSION as PILOT_RUNTIME_CAPABILITY_VERSION,", \'"version": PILOT_RUNTIME_CAPABILITY_VERSION\')'
          if capability_text.count(old_guard) != 1:
              raise SystemExit('Expected one single-line runtime capability marker guard')
          capability.write_text(capability_text.replace(old_guard, new_guard, 1), encoding='utf-8')

          tests = Path('backend/tests/test_pilot_release_capability.py')
          tests_text = tests.read_text(encoding='utf-8')
          old_fixture = '        "from scripts.pilot_release_capability import CAPABILITY_VERSION as PILOT_RUNTIME_CAPABILITY_VERSION\\n"\n'
          new_fixture = (
              '        "from scripts.pilot_release_capability import (\\n"\n'
              '        "    CAPABILITY_VERSION as PILOT_RUNTIME_CAPABILITY_VERSION,\\n"\n'
              '        ")\\n"\n'
          )
          if tests_text.count(old_fixture) != 1:
              raise SystemExit('Expected one single-line runtime fixture import')
          tests.write_text(tests_text.replace(old_fixture, new_fixture, 1), encoding='utf-8')
          PY
      - name: Install and validate unit contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r backend/requirements.txt
          python3 -m compileall -q scripts backend
          python3 -m pytest -q \
            backend/tests/test_pilot_release_capability.py \
            backend/tests/test_pilot_runtime.py \
            backend/tests/test_backup_integrity.py
      - name: Create clean final commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-capability-v8.yml
          rm .github/workflows/retry-capability-v8.yml
          rm .github/workflows/finalize-capability-v8.yml
          rm .github/workflows/finalize-capability-v8-import.yml
          git config user.name "FLASHIN Release Guard"
          git config user.email "release-guard@flashin.local"
          git add -A
          git commit -m "Require full rollback capability v8"
      - name: Validate current immutable repository archive
        run: python3 -m pytest -q backend/tests/test_pilot_release_capability_repository.py
      - name: Push validated v8 commit
        run: git push origin HEAD:agent/pilot-release-capability-v8

name: Production Database Migration

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact Git SHA to migrate
        required: true
        type: string
      confirm_migration:
        description: Explicitly acknowledge applying Alembic DDL to FLASHIN production PostgreSQL
        required: true
        default: "NO"
        type: choice
        options:
          - "NO"
          - "APPLY"

permissions:
  contents: read

jobs:
  migrate-production-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_sha }}
      DATABASE_URL: ${{ secrets.FLASHIN_PRODUCTION_DATABASE_URL }}
    steps:
      - name: Require explicit migration acknowledgement
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirm_migration }}" = "APPLY"

      - name: Checkout exact release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # releases/v4
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Prove checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha must be a full 40-character lowercase Git SHA" >&2
            exit 1
          fi
          test "$actual_sha" = "$EXPECTED_SOURCE_SHA"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # releases/v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check --timeout 60 --retries 8 -r backend/requirements.txt

      - name: Probe database before migration
        run: python scripts/database_migration_probe.py > /tmp/database-before.json

      - name: Apply Alembic migrations through repository head
        run: alembic -c backend/alembic.ini upgrade head

      - name: Require current Alembic heads after migration
        run: python scripts/database_migration_probe.py --require-current > /tmp/database-after.json

      - name: Build sanitized migration evidence
        shell: bash
        run: |
          python3 - "$EXPECTED_SOURCE_SHA" /tmp/database-before.json /tmp/database-after.json <<'PY'
          import json
          import subprocess
          import sys

          expected_sha, before_path, after_path = sys.argv[1:4]
          actual_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()

          with open(before_path, encoding="utf-8") as handle:
              before = json.load(handle)
          with open(after_path, encoding="utf-8") as handle:
              after = json.load(handle)

          passed = (
              actual_sha == expected_sha
              and before.get("reachable") is True
              and after.get("reachable") is True
              and after.get("migrations_current") is True
              and after.get("current_heads") == after.get("expected_heads")
          )

          report = {
              "schema_version": 1,
              "kind": "flashin_production_database_migration",
              "expected_git_sha": expected_sha,
              "git_sha": actual_sha,
              "release_identity_ok": actual_sha == expected_sha,
              "before": before,
              "after": after,
              "pass": passed,
          }

          with open("production-database-migration-proof.json", "w", encoding="utf-8") as handle:
              json.dump(report, handle, sort_keys=True)
              handle.write("\n")

          print(json.dumps(report, sort_keys=True))
          if not passed:
              raise SystemExit(1)
          PY

      - name: Upload sanitized migration proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-database-migration-${{ inputs.expected_sha }}
          path: production-database-migration-proof.json
          if-no-files-found: warn
          retention-days: 30

name: Fix audit package imports v15

on:
  push:
    branches:
      - agent/pilot-accountable-audit-v15
    paths:
      - .github/workflows/fix-audit-package-imports-v15.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pilot-accountable-audit-v15
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply package import compatibility
        run: python .github/scripts/fix_audit_package_imports_v15.py
      - name: Validate script and package modes
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python -m compileall scripts/pilot_control_audit.py scripts/pilot_control_chain.py
          python -c "import scripts.pilot_control_audit, scripts.pilot_control_chain"
          PYTHONPATH=scripts python -c "import pilot_control_audit, pilot_control_chain"
          pytest -q \
            backend/tests/test_pilot_runtime.py \
            backend/tests/test_pilot_runtime_cli.py \
            backend/tests/test_pilot_control_audit.py \
            backend/tests/test_pilot_release_capability.py
      - name: Create clean compatibility commit
        run: |
          rm .github/workflows/fix-audit-package-imports-v15.yml
          rm .github/scripts/fix_audit_package_imports_v15.py
          git config user.name "FLASHIN Audit Import Guard"
          git config user.email "audit-import-guard@flashin.local"
          git add -A
          git commit -m "Support audit imports in script and package modes"
      - name: Validate immutable repository archive
        run: pytest -q backend/tests/test_pilot_release_capability_repository.py
      - name: Push validated compatibility fix
        run: git push origin HEAD:agent/pilot-accountable-audit-v15

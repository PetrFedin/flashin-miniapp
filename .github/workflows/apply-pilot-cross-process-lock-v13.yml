name: Apply pilot cross-process lock v13

on:
  push:
    branches:
      - agent/pilot-cross-process-lock-v13
    paths:
      - .github/workflows/apply-pilot-cross-process-lock-v13.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pilot-cross-process-lock-v13
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply cross-process lock contract
        run: python .github/scripts/apply_pilot_cross_process_lock_v13.py
      - name: Install and validate targeted contract
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python -m compileall \
            scripts/pilot_control_lock.py \
            scripts/pilot_control.py
          pytest -q \
            backend/tests/test_pilot_control.py \
            backend/tests/test_pilot_control_binding.py \
            backend/tests/test_pilot_control_signature.py \
            backend/tests/test_pilot_release_capability.py
      - name: Create clean v13 commit
        run: |
          rm .github/workflows/apply-pilot-cross-process-lock-v13.yml
          rm .github/scripts/apply_pilot_cross_process_lock_v13.py
          git config user.name "FLASHIN Pilot State Lock Guard"
          git config user.email "pilot-state-lock-guard@flashin.local"
          git add -A
          git commit -m "Serialize pilot state mutations across processes"
      - name: Validate immutable repository archive
        run: pytest -q backend/tests/test_pilot_release_capability_repository.py
      - name: Push validated capability v13
        run: git push origin HEAD:agent/pilot-cross-process-lock-v13

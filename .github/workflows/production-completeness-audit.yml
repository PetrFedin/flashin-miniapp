name: Production Completeness Audit

on:
  push:
    branches:
      - audit/production-completeness-20260909
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-completeness-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adversarial-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flashin
          POSTGRES_PASSWORD: flashin
          POSTGRES_DB: flashin_completeness_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flashin -d flashin_completeness_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      AUDIT_DISPOSABLE_DB: "true"
      DATABASE_URL: postgresql+psycopg2://flashin:flashin@127.0.0.1:5432/flashin_completeness_audit
      TELEGRAM_BOT_TOKEN: audit-test-token
      BOT_TOKEN: audit-test-token
      JWT_SECRET: audit-test-secret
      ADMIN_EMAIL: audit-admin@test.local
      ADMIN_PASSWORD: audit-test-password
      MINI_APP_URL: http://127.0.0.1:5173
      API_PUBLIC_URL: http://127.0.0.1:8000
      ADMIN_URL: http://127.0.0.1:5174
      CORS_ORIGINS: http://127.0.0.1:5173,http://127.0.0.1:5174
      USE_CREATE_ALL: "false"
      ENABLE_SEED: "false"
      PILOT_RUNTIME_ENFORCED: "false"
      MEILISEARCH_ENABLED: "false"
      METRICS_ENABLED: "false"
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # releases/v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # releases/v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Apply production migrations
        run: alembic -c backend/alembic.ini upgrade head
      - name: Run adversarial production-completeness probes
        run: python scripts/production_completeness_probe.py
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # releases/v4
        with:
          name: production-completeness-audit-evidence
          path: audit-output/production-completeness-probes.json
          if-no-files-found: warn
          retention-days: 30

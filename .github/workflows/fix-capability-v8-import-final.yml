name: Finalize shared capability v8 contract

on:
  push:
    branches:
      - agent/pilot-release-capability-v8

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pilot-release-capability-v8
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch shared capability version contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          Path('scripts/pilot_release_contract.py').write_text(
              '"""Shared immutable pilot release capability contract."""\n\n'
              'CAPABILITY_VERSION = 8\n',
              encoding='utf-8',
          )

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'scripts/pilot_release_capability.py',
              'from pilot_evidence import require_signing_secret, sign_payload, verify_payload_signature\n',
              'from pilot_evidence import require_signing_secret, sign_payload, verify_payload_signature\n'
              'from pilot_release_contract import CAPABILITY_VERSION\n',
          )
          replace_once('scripts/pilot_release_capability.py', 'CAPABILITY_VERSION = 8\n', '')
          replace_once(
              'scripts/pilot_release_capability.py',
              '    "scripts/pilot_release_capability.py",\n',
              '    "scripts/pilot_release_capability.py",\n    "scripts/pilot_release_contract.py",\n',
          )
          replace_once(
              'scripts/pilot_release_capability.py',
              '            _require_markers(bundle, files, "backend/services/pilot_runtime.py", ("from scripts.pilot_release_capability import (", "CAPABILITY_VERSION as PILOT_RUNTIME_CAPABILITY_VERSION,", \'"version": PILOT_RUNTIME_CAPABILITY_VERSION\'), errors)\n',
              '            _require_markers(bundle, files, "scripts/pilot_release_contract.py", ("CAPABILITY_VERSION = 8",), errors)\n'
              '            _require_markers(bundle, files, "scripts/pilot_release_capability.py", ("from pilot_release_contract import CAPABILITY_VERSION",), errors)\n'
              '            _require_markers(bundle, files, "backend/services/pilot_runtime.py", ("from scripts.pilot_release_contract import CAPABILITY_VERSION", \'"version": CAPABILITY_VERSION\'), errors)\n',
          )
          replace_once(
              'backend/services/pilot_runtime.py',
              'from scripts.pilot_release_capability import (\n    CAPABILITY_VERSION as PILOT_RUNTIME_CAPABILITY_VERSION,\n)\n',
              'from scripts.pilot_release_contract import CAPABILITY_VERSION\n',
          )
          replace_once(
              'backend/services/pilot_runtime.py',
              '        "version": PILOT_RUNTIME_CAPABILITY_VERSION,',
              '        "version": CAPABILITY_VERSION,',
          )

          tests = Path('backend/tests/test_pilot_release_capability.py')
          text = tests.read_text(encoding='utf-8')
          old_runtime = (
              '    "backend/services/pilot_runtime.py": (\n'
              '        "from scripts.pilot_release_capability import (\\n"\n'
              '        "    CAPABILITY_VERSION as PILOT_RUNTIME_CAPABILITY_VERSION,\\n"\n'
              '        ")\\n"\n'
              '        \'"version": PILOT_RUNTIME_CAPABILITY_VERSION\\n\'\n'
              '    ),\n'
          )
          new_runtime = (
              '    "scripts/pilot_release_capability.py": "from pilot_release_contract import CAPABILITY_VERSION\\n",\n'
              '    "scripts/pilot_release_contract.py": "CAPABILITY_VERSION = 8\\n",\n'
              '    "backend/services/pilot_runtime.py": (\n'
              '        "from scripts.pilot_release_contract import CAPABILITY_VERSION\\n"\n'
              '        \'"version": CAPABILITY_VERSION\\n\'\n'
              '    ),\n'
          )
          if text.count(old_runtime) != 1:
              raise SystemExit('Expected one complete synthetic runtime fixture block')
          tests.write_text(text.replace(old_runtime, new_runtime, 1), encoding='utf-8')
          PY
      - name: Install and validate capability imports
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r backend/requirements.txt
          python3 -m compileall -q scripts backend
          python3 -m pytest -q \
            backend/tests/test_pilot_release_capability.py \
            backend/tests/test_pilot_runtime.py \
            backend/tests/test_pilot_runtime_cli.py \
            backend/tests/test_backup_integrity.py
      - name: Create clean final commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-capability-v8-import.yml
          rm .github/workflows/fix-capability-v8-import-final.yml
          git config user.name "FLASHIN Release Guard"
          git config user.email "release-guard@flashin.local"
          git add -A
          git commit -m "Share pilot capability version without CLI imports"
      - name: Validate immutable repository archive
        run: python3 -m pytest -q backend/tests/test_pilot_release_capability_repository.py
      - name: Push validated import fix
        run: git push origin HEAD:agent/pilot-release-capability-v8

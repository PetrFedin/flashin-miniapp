name: Distributed Rate Limit State

on:
  pull_request:
  push:
    branches:
      - hardening/production-20260918

permissions:
  contents: read

concurrency:
  group: rate-limit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  redis-rate-limit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:8.10.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379/0
      TELEGRAM_BOT_TOKEN: test-token
      JWT_SECRET: test-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # releases/v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # releases/v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Prove route policy and production configuration
        run: >-
          python -m pytest -q
          backend/tests/test_rate_limit.py
          backend/tests/test_production_config.py
      - name: Prove shared Redis budget and concurrency
        run: python scripts/rate_limit_redis_smoke.py

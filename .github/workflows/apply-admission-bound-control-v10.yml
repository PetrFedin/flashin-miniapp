name: Apply admission-bound control capability v10

on:
  push:
    branches:
      - agent/pilot-admission-bound-control-v10

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pilot-admission-bound-control-v10
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply admission-bound control plane
        run: python3 .github/scripts/apply_admission_bound_control_v10.py
      - name: Install and validate targeted contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r backend/requirements.txt
          python3 -m compileall -q scripts backend .github/scripts
          python3 -m pytest -q \
            backend/tests/test_pilot_control.py \
            backend/tests/test_pilot_control_binding.py \
            backend/tests/test_pilot_runtime.py \
            backend/tests/test_pilot_runtime_cli.py \
            backend/tests/test_pilot_runtime_wiring.py \
            backend/tests/test_pilot_release_capability.py
      - name: Create clean v10 commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-admission-bound-control-v10.yml
          rm .github/scripts/apply_admission_bound_control_v10.py
          git config user.name "FLASHIN Pilot Control Guard"
          git config user.email "pilot-control-guard@flashin.local"
          git add -A
          git commit -m "Bind pilot control state to signed admission"
      - name: Validate immutable repository archive
        run: python3 -m pytest -q backend/tests/test_pilot_release_capability_repository.py
      - name: Push validated capability v10
        run: git push origin HEAD:agent/pilot-admission-bound-control-v10

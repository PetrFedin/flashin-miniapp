name: Apply pilot inventory ledger v17

on:
  push:
    branches:
      - agent/pilot-inventory-ledger-v17

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pilot-inventory-ledger-v17
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Apply inventory ledger contract
        run: |
          python .github/patches/fix_pilot_inventory_ledger_v17_anchor.py
          python .github/patches/apply_pilot_inventory_ledger_v17.py
          python .github/patches/fix_generated_capability_v17.py
      - name: Install and validate targeted contract
        run: |
          pip install -r backend/requirements.txt
          python -m compileall -q backend bot scripts
          python -m pytest -q \
            backend/tests/test_inventory_movement_ledger.py \
            backend/tests/test_inventory_batch_transitions.py \
            backend/tests/test_inventory_invariants.py \
            backend/tests/test_order_cancellation_service.py \
            backend/tests/test_payment_settlement.py \
            backend/tests/test_pilot_database_evidence.py \
            backend/tests/test_pilot_control.py \
            backend/tests/test_pilot_control_signature.py \
            backend/tests/test_pilot_runtime.py \
            backend/tests/test_pilot_runtime_cli.py \
            backend/tests/test_pilot_release_capability.py
      - name: Create clean capability v17 commit
        run: |
          rm -f .github/workflows/apply-pilot-inventory-ledger-v17.yml
          rm -f .github/patches/apply_pilot_inventory_ledger_v17.py
          rm -f .github/patches/fix_pilot_inventory_ledger_v17_anchor.py
          rm -f .github/patches/fix_generated_capability_v17.py
          rmdir .github/patches 2>/dev/null || true
          git config user.name "FLASHIN Inventory Ledger Guard"
          git config user.email "pilot-inventory-ledger@flashin.local"
          git add -A
          git diff --cached --check
          git commit -m "Bind pilot stock evidence to inventory ledger"
      - name: Validate immutable repository archive
        run: python -m pytest -q backend/tests/test_pilot_release_capability_repository.py
      - name: Push validated capability v17
        run: git push origin HEAD:agent/pilot-inventory-ledger-v17

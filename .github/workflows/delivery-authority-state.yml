name: Delivery Authority State

on:
  pull_request:
  push:
    branches:
      - pilot/e2e-hardening-20260808

permissions:
  contents: read

concurrency:
  group: delivery-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-delivery-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flashin
          POSTGRES_PASSWORD: flashin
          POSTGRES_DB: flashin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flashin -d flashin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg2://flashin:flashin@127.0.0.1:5432/flashin
      TELEGRAM_BOT_TOKEN: test-token
      BOT_TOKEN: test-token
      JWT_SECRET: test-secret
      ADMIN_EMAIL: admin@test.local
      ADMIN_PASSWORD: test-password
      MINI_APP_URL: http://localhost:5173
      API_PUBLIC_URL: http://localhost:8000
      ADMIN_URL: http://localhost:5174
      USE_CREATE_ALL: "false"
      ENABLE_SEED: "false"
      PILOT_RUNTIME_ENFORCED: "false"
      MEILISEARCH_ENABLED: "false"
      METRICS_ENABLED: "false"
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # releases/v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # releases/v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Apply migrations
        run: alembic -c backend/alembic.ini upgrade head
      - name: Prove delivery commercial authority
        run: python scripts/delivery_authority_state_smoke.py
      - name: Prove durable provider booking lifecycle
        run: python scripts/delivery_provider_booking_smoke.py

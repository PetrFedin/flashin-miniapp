name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Require protected exact-green main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/release_ci_gate.py

      - name: Run repository preflight
        run: python3 scripts/preflight.py

      - name: Refuse tracked private pilot evidence
        run: python3 scripts/release_private_evidence_guard.py

      - name: Build verified immutable release archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          release_id="main-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"
          archive="$(python3 scripts/release_control.py create --release-id "$release_id" --print-path)"
          python3 scripts/release_control.py verify --archive "$archive"
          python3 scripts/pilot_release_capability.py inspect --archive "$archive"
          test -f "${archive}.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=${archive}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload immutable release and checksum
        uses: actions/upload-artifact@v4
        with:
          name: flashin-immutable-release-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14
